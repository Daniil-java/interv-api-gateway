server:
  port: 8090

spring:
  application:
    name: api-gateway
  config:
    import-check:
      enabled: false
  cloud:
    config:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

